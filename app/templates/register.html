<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Paneli | EpiTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>

<body>
    <div class="header">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1><b>EpiTrack</b></h1>
            </div>
        </div>
    </div>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card" style="max-width: 500px; margin: 50px auto;">
            <h2 style="text-align: center; margin-bottom: 20px;">Kayıt Paneli</h2>
            <form action="{{ url_for('auth.register') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group mb-3">
                    <label>Kayıt Tipi</label>
                    <select name="role" id="roleSelect" class="form-control" onchange="toggleFields()">
                        <option value="patient" selected>Hasta</option>
                        <option value="doctor">Doktor</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label>T.C. Kimlik Numarası:</label>
                    <input type="text" name="tcno" class="form-control" required placeholder="TC Kimlik numaranız"
                        maxlength="11">
                </div>

                <div class="form-group mb-3">
                    <label>Ad Soyad:</label>
                    <input type="text" name="fullname" class="form-control" required>
                </div>
                <div class="form-group mb-3">
                    <label>Şifre:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div id="patientFields">
                    <div class="form-group mb-3">
                        <label>Doğum Tarihi:</label>
                        <input type="date" name="birthdate" class="form-control">
                    </div>
                    <div class="form-group mb-3">
                        <label>Kan Grubu:</label>
                        <select name="bloodtype" class="form-control">
                            <option value="">Seçiniz</option>
                            <option value="A+">A RH+</option>
                            <option value="A-">A RH-</option>
                            <option value="B+">B RH+</option>
                            <option value="B-">B RH-</option>
                            <option value="AB+">AB RH+</option>
                            <option value="AB-">AB RH-</option>
                            <option value="0+">0 RH+</option>
                            <option value="0-">0 RH-</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label>Doktor Seçimi:</label>
                        <select name="doctorid" class="form-control">
                            <option value="">Doktor Seçiniz</option>
                            {% for doc in doctors %}
                            <option value="{{ doc.id }}">{{ doc.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Kayıt Ol</button>
            </form>
            <p class="text-center mt-3">
                Zaten hesabınız var mı? <a href="{{ url_for('auth.index') }}" class="text-decoration-none fw-bold">Giriş
                    Yap</a>
            </p>
        </div>
    </div>

    <script>
        function toggleFields() {
            const role = document.getElementById('roleSelect').value;
            const patientFields = document.getElementById('patientFields');
            const inputs = patientFields.querySelectorAll('input, select');

            if (role === 'patient') {
                patientFields.style.display = 'block';
                inputs.forEach(input => input.required = true);
            } else {
                patientFields.style.display = 'none';
                inputs.forEach(input => input.required = false);
            }
        }

        window.onload = toggleFields;
    </script>
</body>

</html>
