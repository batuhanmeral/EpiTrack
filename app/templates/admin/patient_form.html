{% extends "admin/base.html" %}
{% block title %}{{ 'Hasta Düzenle' if patient else 'Yeni Hasta' }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="mb-3">{{ 'Hasta Düzenle' if patient else 'Yeni Hasta' }}</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group mb-3">
            <label>Ad Soyad:</label>
            <input type="text" name="fullname" class="form-control" value="{{ patient.fullname if patient else '' }}"
                required>
        </div>
        <div class="form-group mb-3">
            <label>T.C. Kimlik Numarası:</label>
            <input type="text" name="tcno" class="form-control" maxlength="11"
                value="{{ patient.tcno if patient else '' }}" required>
        </div>
        <div class="form-group mb-3">
            <label>{{ 'Yeni Parola (boş bırakılırsa değişmez):' if patient else 'Parola:' }}</label>
            <input type="password" name="password" class="form-control" {% if not patient %}required{% endif %}>
        </div>
        <div class="row">
            <div class="col-md-6 form-group mb-3">
                <label>Kan Grubu:</label>
                <select name="bloodtype" class="form-select">
                    {% set bt = patient.bloodtype if patient else '' %}
                    <option value="">Seçiniz</option>
                    {% for g in ['A+','A-','B+','B-','AB+','AB-','0+','0-'] %}
                    <option value="{{ g }}" {% if bt==g %}selected{% endif %}>{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 form-group mb-3">
                <label>Doğum Tarihi:</label>
                <input type="date" name="birthdate" class="form-control"
                    value="{{ patient.birthdate if patient and patient.birthdate else '' }}">
            </div>
        </div>
        <div class="form-group mb-3">
            <label>Doktor:</label>
            <select name="doctorid" class="form-select" required>
                <option value="">Doktor Seçiniz</option>
                {% for d in doctors %}
                <option value="{{ d.id }}" {% if patient and patient.doctorid==d.id %}selected{% endif %}>
                    {{ d.fullname }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Kaydet</button>
        <a href="{{ url_for('admin.patients') }}" class="btn btn-outline-secondary">İptal</a>
    </form>
</div>
{% endblock %}
