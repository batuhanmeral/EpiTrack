{% extends "admin/base.html" %}
{% block title %}Profilim{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="mb-3">Profil Bilgilerim</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group mb-3">
            <label>Ad Soyad:</label>
            <input type="text" name="fullname" class="form-control" value="{{ admin.fullname }}" required>
        </div>
        <div class="form-group mb-3">
            <label>Kullanıcı Adı:</label>
            <input type="text" name="username" class="form-control" value="{{ admin.username }}" required>
        </div>

        <hr>
        <p class="text-muted mb-3">Parolayı değiştirmek istemiyorsanız aşağıdaki alanları boş bırakın.</p>

        <div class="form-group mb-3">
            <label>Mevcut Parola:</label>
            <input type="password" name="current_password" class="form-control" autocomplete="current-password">
        </div>
        <div class="form-group mb-3">
            <label>Yeni Parola:</label>
            <input type="password" name="new_password" class="form-control" autocomplete="new-password">
        </div>
        <div class="form-group mb-3">
            <label>Yeni Parola (Tekrar):</label>
            <input type="password" name="confirm_password" class="form-control" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">Kaydet</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">İptal</a>
    </form>
</div>
{% endblock %}
