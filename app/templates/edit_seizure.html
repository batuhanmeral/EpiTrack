<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöbet Düzenle | EpiTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>

<body>
    <div class="header">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1><b>EpiTrack</b></h1>
                <div style="text-align: right;">
                <a href="/patient/dashboard" class="btn btn-outline-light btn-sm">İptal ve Panele
                    Dön</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card mb-4" style="max-width: 600px; margin: 50px auto;">
            <h2>Nöbet Kaydını Düzenle</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Tarih:</label>
                        <input type="date" name="date" class="form-control"
                            value="{{ seizure.seizuretime.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label>Saat:</label>
                        <input type="time" name="time" class="form-control"
                            value="{{ seizure.seizuretime.strftime('%H:%M') }}" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label>Nöbet Tipi:</label>
                    <select name="type" class="form-control">
                        {% for value, label in seizure_types %}
                        <option value="{{ value }}" {% if seizure.type==value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label>Süre (Dakika):</label>
                    <input type="number" name="duration" min="0" class="form-control"
                        value="{{ seizure.duration if seizure.duration is not none else '' }}">
                </div>

                <div class="form-group mb-3">
                    <label>Postiktal Durum (Nöbet Sonrası):</label>
                    <input type="text" name="post_seizure" class="form-control" value="{{ seizure.postictal }}">
                </div>

                <div class="form-group mb-3">
                    <label>Olası Tetikleyici:</label>
                    <select name="trigger" class="form-control">
                        <option value="">Seçiniz</option>
                        {% for t in seizure_triggers %}
                        <option value="{{ t }}" {% if seizure.trigger==t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                        {% if seizure.trigger and seizure.trigger not in seizure_triggers %}
                        <option value="{{ seizure.trigger }}" selected>{{ seizure.trigger }} (mevcut)</option>
                        {% endif %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Değişiklikleri Kaydet</button>
            </form>
        </div>
    </div>
</body>

</html>
